name: Bug report
description: Report a problem with Statens vegvesen for Home Assistant
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a report. Include one problem per issue.
        Remove tokens, private hostnames, personal zone names and route coordinates from logs or screenshots.
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: The installed release number, or commit ID when using main.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Integration installation method
      options:
        - HACS custom repository
        - Manual installation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the expected behavior and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: For UI problems, include the interface language and whether it occurs in a browser or the companion app.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include relevant error messages and timestamps, with private details removed. Full startup logs are unnecessary.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots or public source IDs can help. Share only locations and details you are comfortable making public.
