name: Feature request
description: Suggest an improvement to the integration
body:
  - type: markdown
    attributes:
      value: Search existing requests first and describe one improvement per issue. Use generic examples instead of personal locations.
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
      description: Describe the use case or problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Describe how the integration could support this use case.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
      description: Include any relevant alternatives or public API documentation.
