name: Validate

on:
  workflow_dispatch:
  schedule:
    - cron:  "0 0 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  packaging:
    name: Pinned Hassfest and local HACS packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.8"
      - name: Install uv
        run: python -m pip install uv==0.12.22
      - name: Run the same pinned validators as local development
        run: |
          scripts/validate-hassfest
          scripts/validate-hacs

  hacs: # https://github.com/hacs/action
    name: Remote HACS repository validation
    # HACS downloads public content; private repositories cannot be installed.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Run HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          comment: false
