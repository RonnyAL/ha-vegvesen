name: Checks

on:
  push:
    branches: [main, "dev/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Route map card / Node 22.23.2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Lint, formatting, tests and reproducible bundle
        run: npm run check

  checks:
    name: Python 3.14.8 / HA 2026.9.4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.8"
      - name: Install uv
        run: python -m pip install uv==0.12.22
      - name: Install locked environment
        run: scripts/setup
      - name: Lint, formatting, tests
        run: scripts/check

  minimum:
    name: Python 3.13.11 / HA 2025.12.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Python for uv bootstrap
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.8"
      - name: Install uv
        run: python -m pip install uv==0.12.22
      - name: Minimum target tests with locked local interpreter and compiler
        run: scripts/check-minimum

  beta:
    name: Python 3.14.8 / HA 2026.10.0b0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14.8"
      - name: Install uv
        run: python -m pip install uv==0.12.22
      - name: Beta target tests
        run: scripts/check-beta
