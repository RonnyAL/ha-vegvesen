[project]
name = "ha-vegvesen"
version = "0.11.0"
description = "Statens vegvesen custom integration for Home Assistant"
requires-python = ">=3.14.8,<3.15"
dependencies = ["pyproj==3.8.0", "shapely==2.1.2"]

[dependency-groups]
dev = [
    "aioresponses==0.7.9",
    "homeassistant==2026.9.4",
    "PyTurboJPEG==1.8.3", # HA 2026.9.4 camera platform's test dependency
    "pytest-homeassistant-custom-component==0.13.367",
    "ruff==0.15.21",
]
smoke = [
    "gazetteer-matcher==1.1.0",
    "ha-ffmpeg==3.2.2",
    "hassil==3.12.1",
    "home-assistant-frontend==20260826.7", # HA 2026.9.4 frontend requirement
    "home-assistant-intents==2026.8.28",
    "mutagen==1.48.1",
    "playwright==1.63.0",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "rf-protocols==4.3.0",
]
validation = [
    "aiogithubapi==26.0.0", # Imported by HACS 2.0.5's official schemas
    "infrared-protocols==9.0.0", # Imported by HA 2026.9.4 Hassfest
    "pipdeptree==2.26.1",
    "tqdm==4.67.1",
]

[tool.uv]
package = false
build-constraint-dependencies = [
    "pybind11==3.1.0",
    "setuptools==84.0.0",
    "wheel==0.48.0",
]

[tool.uv.extra-build-dependencies]
pymicro-vad = ["ziglang==0.15.2"]
pyspeex-noise = ["ziglang==0.15.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket --cov=custom_components.vegvesen --cov-report=term-missing"
